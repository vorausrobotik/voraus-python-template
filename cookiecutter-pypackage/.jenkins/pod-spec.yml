spec:
  containers:
    - name: build
      image: artifactory.vorausrobotik.com/docker/voraus-build-image:8.1.0
      alwaysPullImage: true
      securityContext:
        runAsUser: 0
      command:
        - cat
      tty: true
      volumeMounts:
        - mountPath: /var/run/docker.sock
          name: docker-sock
  volumes:
    - name: docker-sock
      hostPath:
        path: /var/run/docker.sock
