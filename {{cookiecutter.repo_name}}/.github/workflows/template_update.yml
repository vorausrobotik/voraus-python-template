name: Template Update

on:
  schedule:
    # Run every Saturday at 3:00 AM UTC
    - cron: '0 3 * * 6'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-template:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Check for template updates
        id: check
        run: |
          if uvx cruft check; then
            echo "update_available=false" >> $GITHUB_OUTPUT
            echo "No template updates available"
          else
            echo "update_available=true" >> $GITHUB_OUTPUT
            echo "Template updates available"
          fi

      - name: Check for existing template update PRs
        if: steps.check.outputs.update_available == 'true'
        id: existing_pr
        env:
          GH_TOKEN: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}
        run: |
          # Check for open PRs with template-update label
          PR_COUNT=$(gh pr list --label "template-update" --state open --json number --jq 'length')

          if [ "$PR_COUNT" -gt 0 ]; then
            echo "should_create_pr=false" >> $GITHUB_OUTPUT
            echo "Found $PR_COUNT existing template update PR(s). Skipping creation of new PR."
          else
            echo "should_create_pr=true" >> $GITHUB_OUTPUT
            echo "No existing template update PRs found. Will create new PR."
          fi

      - name: Get template commit info
        if: steps.check.outputs.update_available == 'true' && steps.existing_pr.outputs.should_create_pr == 'true'
        id: template_info
        run: |
          # Get current template commit before update
          CURRENT_COMMIT=$(jq -r '.commit' .cruft.json)
          echo "current_commit=$CURRENT_COMMIT" >> $GITHUB_OUTPUT

          # Get template repo URL
          TEMPLATE_URL=$(jq -r '.template' .cruft.json)
          echo "template_url=$TEMPLATE_URL" >> $GITHUB_OUTPUT

          # Get checkout reference (branch/tag) if specified
          CHECKOUT=$(jq -r '.checkout // "null"' .cruft.json)
          echo "checkout=$CHECKOUT" >> $GITHUB_OUTPUT

      - name: Update template
        if: steps.check.outputs.update_available == 'true' && steps.existing_pr.outputs.should_create_pr == 'true'
        run: |
          CHECKOUT="{% raw %}${{ steps.template_info.outputs.checkout }}{% endraw %}"
          if [ "$CHECKOUT" != "null" ]; then
            uvx cruft update --skip-apply-ask -c "$CHECKOUT"
          else
            uvx cruft update --skip-apply-ask
          fi

      - name: Get updated commit info and changes
        if: steps.check.outputs.update_available == 'true' && steps.existing_pr.outputs.should_create_pr == 'true'
        id: changes
        run: |
          # Get new commit after update
          LATEST_COMMIT=$(jq -r '.commit' .cruft.json)
          echo "latest_commit=$LATEST_COMMIT" >> $GITHUB_OUTPUT

          CURRENT_COMMIT="{% raw %}${{ steps.template_info.outputs.current_commit }}{% endraw %}"
          TEMPLATE_URL="{% raw %}${{ steps.template_info.outputs.template_url }}{% endraw %}"
          CHECKOUT="{% raw %}${{ steps.template_info.outputs.checkout }}{% endraw %}"

          # Clone template repo to get commit history
          echo "Cloning template repository..."
          git clone "$TEMPLATE_URL" /tmp/template_repo
          cd /tmp/template_repo

          # Checkout the correct branch if specified
          if [ "$CHECKOUT" != "null" ]; then
            echo "Checking out branch: $CHECKOUT"
            git checkout "$CHECKOUT"
          fi

          # Verify both commits exist
          echo "Verifying commits..."
          if ! git cat-file -e "$CURRENT_COMMIT^{commit}" 2>/dev/null; then
            echo "Error: Current commit $CURRENT_COMMIT not found in repository"
            echo "commits=*Error: Could not find current commit in template repository*" >> $GITHUB_OUTPUT
            exit 0
          fi

          if ! git cat-file -e "$LATEST_COMMIT^{commit}" 2>/dev/null; then
            echo "Error: Latest commit $LATEST_COMMIT not found in repository"
            echo "commits=*Error: Could not find latest commit in template repository*" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get all commits between current and latest commit
          echo "Getting commit history from $CURRENT_COMMIT to $LATEST_COMMIT..."
          COMMITS=$(git log --oneline "$CURRENT_COMMIT".."$LATEST_COMMIT" --pretty=format:"- %h %s" 2>&1)

          if [ -z "$COMMITS" ]; then
            echo "No commits found in range or commits are in reverse order"
            COMMITS="*No new commits found between $CURRENT_COMMIT and $LATEST_COMMIT*"
          fi

          echo "Commits found:"
          echo "$COMMITS"

          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Check for .rej files (merge conflicts)
          cd "$GITHUB_WORKSPACE"
          REJ_FILES=$(find . -name "*.rej" -type f)
          if [ -n "$REJ_FILES" ]; then
            echo "Found merge conflict files:"
            echo "$REJ_FILES"
            CONFLICT_LIST=$(echo "$REJ_FILES" | sed 's/^\.\//- /')
            echo "conflict_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CONFLICT_LIST" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
          else
            echo "No merge conflicts found"
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check.outputs.update_available == 'true' && steps.existing_pr.outputs.should_create_pr == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}
          commit-message: 'chore: Update from template'
          branch: chore/update-template-{% raw %}${{ steps.changes.outputs.latest_commit }}{% endraw %}
          delete-branch: true
          title: 'chore: Update from template'
          body: |
            This PR updates the project from the cookiecutter template.

            ## Template Changes

            {% raw %}${{ steps.changes.outputs.commits }}{% endraw %}
            {% raw %}${{ steps.changes.outputs.has_conflicts == 'true' && format('

            ## ⚠️ Merge Conflicts Detected

            The following files had merge conflicts during the template update:

            {0}

            **These conflicts require manual resolution.** Review the `.rej` files to see what changes could not be automatically applied.', steps.changes.outputs.conflict_files) || '' }}{% endraw %}

            ---

            *This PR was automatically created by the template update workflow.*

            ⚠️ **Please review the changes carefully**, especially:
            - Verify that project-specific customizations are preserved
            - Run tests to ensure nothing broke
            - Test foo
          labels: |
            template-update
            automated
